<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Citas - Clínica Dental Sonrisa</title>
    <link rel="stylesheet" href="agregarcita.css">
    <!-- Iconos de FontAwesome para darle mejor estética -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-hospital"></i> Clínica Dental Sonrisa+</h1>
            <p>Reserva tu cita médica de manera rápida y sencilla</p>
        </header>

        <main>
            <form id="appointmentForm">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user"></i> Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="Ej. juan@correo.com">
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone"></i> Teléfono</label>
                    <input type="tel" id="phone" required placeholder="Ej. 5551234567">
                </div>

                <div class="form-group">
                    <label for="department"><i class="fa-solid fa-stethoscope"></i> Especialidad</label>
                    <select id="department" required>
                        <option value="">Seleccione una especialidad</option>
                        <option value="Endodoncia">Endodoncia</option>
                        <option value="Ortodoncia">Ortodoncia</option>
                        <option value="Estetica Dental">Estetica Dental</option>
                        <option value="OdontologiaGeneral">Odontologia General</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date"><i class="fa-solid fa-calendar"></i> Fecha de la Cita</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time"><i class="fa-solid fa-clock"></i> Hora</label>
                        <input type="time" id="time" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Confirmar Cita</button>
            </form>

            <!-- Mensaje de éxito oculto por defecto -->
            <div id="successMessage" class="hidden">
                <i class="fa-solid fa-circle-check"></i>
                <h2>¡Cita Registrada con Éxito!</h2>
                <p>Te hemos enviado los detalles de tu cita a tu Whatsapp.</p>
                <button id="newAppointmentBtn" class="btn-secondary">Agendar otra cita</button>
             <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i>Volver a Pagina Principal</a>
            </div>
        </main>
    </div>

    <script src="agregarcita.js"></script>
</body>
</html>
